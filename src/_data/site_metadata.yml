# Reloadable site metadata, available in templates as `site.metadata`.
title: Edward Tippett
tagline: Some kind of maker
description: >-
  Immanentizing the Eschaton
email: edward.tippett@gmail.com

# Link preview image, 1200x630. Regenerate after editing the source with:
#   rsvg-convert -w 1200 -h 630 design/og.svg -o src/images/og.png
image: /images/og.png

# Internal pages, rendered as the masthead navigation on the `page` layout.
# Separate from `links` below because these are same-site (no new tab, and
# the current page is marked with aria-current). The splash pages have no
# masthead.
nav:
  - name: About
    url: /about/
  - name: Hire me
    url: /hire-me/

# Rendered as the footer's Socials menu, in order. An optional
# `rel` is appended to the link's own rel attribute — Mastodon needs rel="me"
# on the link back to verify the profile.
links:
  - name: GitHub
    url: https://github.com/cattekin
  - name: Mastodon
    url: https://mastodon.social/@cattekin
    rel: me
  - name: Bluesky
    url: https://bsky.app/profile/cattekin.bsky.social
  - name: LinkedIn
    url: https://www.linkedin.com/in/cattekin
